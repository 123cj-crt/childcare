<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧托育-管理员登录</title>
  <!-- 引入Font Awesome图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 基础样式重置与全局设置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: url("背景.jpg") no-repeat center center;
      background-size: cover;
      font-family: "Microsoft YaHei", "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    /* 背景遮罩，增强文字可读性 */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.3);
      z-index: -1;
    }

    /* 登录卡片样式 */
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 45px;
      border-radius: 16px;
      background-color: rgba(255, 255, 255, 0.96);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(8px);
      transition: transform 0.3s ease;
    }

    .login-card:hover {
      transform: translateY(-5px);
    }

    /* 标题区域样式 */
    .login-title {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    .login-title::after {
      content: '';
      display: block;
      width: 50px;
      height: 3px;
      background-color: #4cd964;
      margin: 15px auto 0;
      border-radius: 3px;
    }

    .login-title h2 {
      color: #2c3e50;
      font-size: 26px;
      font-weight: 600;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-title h2 i {
      margin-right: 10px;
      color: #4cd964;
      font-size: 28px;
    }

    /* 表单组样式 */
    .form-group {
      margin-bottom: 25px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 10px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    .form-control {
      width: 100%;
      padding: 14px 15px;
      padding-right: 45px; /* 为图标留出空间 */
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: #4cd964;
      box-shadow: 0 0 0 3px rgba(76, 217, 100, 0.15);
    }

    /* 图标位置 */
    .form-group i {
      position: absolute;
      right: 15px;
      top: 45px;
      color: #999;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .form-group i:hover {
      color: #4cd964;
    }

    /* 验证码区域 */
    .captcha-group {
      display: flex;
      gap: 10px;
    }

    .captcha-image {
      width: 130px;
      height: 48px;
      background-color: #f5f5f5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      letter-spacing: 5px;
      color: #333;
      user-select: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .captcha-image:hover {
      background-color: #eee;
    }

    /* 记住密码和忘记密码 */
    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .remember-me input {
      margin-right: 6px;
      width: 16px;
      height: 16px;
      accent-color: #4cd964;
    }

    .forgot-password {
      color: #3498db;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .forgot-password:hover {
      color: #2980b9;
      text-decoration: underline;
    }

    /* 登录按钮样式 */
    .login-btn {
      width: 100%;
      padding: 14px;
      background: #4cd964;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-btn i {
      margin-right: 8px;
    }

    .login-btn:hover {
      background: #45c759;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(76, 217, 100, 0.3);
    }

    .login-btn:disabled {
      background: #a3e9b0;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* 底部版权信息 */
    .copyright {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #999;
    }

    /* 错误提示样式 */
    .error-message {
      color: #e74c3c;
      font-size: 13px;
      margin-top: 5px;
      height: 18px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    /* 响应式调整 */
    @media (max-width: 480px) {
      .login-card {
        padding: 30px 20px;
      }

      .captcha-group {
        flex-direction: column;
      }

      .captcha-image {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-title">
    <h2><i class="fas fa-baby"></i>智慧托育管理平台</h2>
  </div>
  <form id="loginForm">
    <div class="form-group">
      <label for="username">管理员账号</label>
      <input type="text" id="username" class="form-control" required placeholder="请输入账号">
      <i class="fas fa-user"></i>
      <div class="error-message" id="usernameError"></div>
    </div>

    <div class="form-group">
      <label for="password">登录密码</label>
      <input type="password" id="password" class="form-control" required placeholder="请输入密码">
      <i class="fas fa-eye-slash" id="togglePassword"></i>
      <div class="error-message" id="passwordError"></div>
    </div>

    <div class="form-group">
      <label for="captcha">验证码</label>
      <div class="captcha-group">
        <input type="text" id="captcha" class="form-control" required placeholder="请输入验证码">
        <div class="captcha-image" id="captchaImage">点击刷新</div>
      </div>
      <div class="error-message" id="captchaError"></div>
    </div>

    <div class="remember-forgot">
      <label class="remember-me">
        <input type="checkbox" id="rememberMe"> 记住账号
      </label>
      <a href="#" class="forgot-password">忘记密码?</a>
    </div>

    <button type="submit" class="login-btn">
      <i class="fas fa-sign-in-alt"></i> 安全登录
    </button>

    <div class="copyright">
      © 2023 智慧托育管理平台 版权所有
    </div>
  </form>
</div>

<script>
  // 生成随机验证码
  function generateCaptcha() {
    const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
    let captcha = '';
    for (let i = 0; i < 4; i++) {
      captcha += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    // 绘制验证码到canvas
    const canvas = document.createElement('canvas');
    canvas.width = 130;
    canvas.height = 48;
    const ctx = canvas.getContext('2d');

    // 背景色
    ctx.fillStyle = '#f5f5f5';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 干扰线
    for (let i = 0; i < 5; i++) {
      ctx.strokeStyle = `rgba(${Math.random()*100}, ${Math.random()*150}, ${Math.random()*100}, 0.5)`;
      ctx.beginPath();
      ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
      ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
      ctx.stroke();
    }

    // 干扰点
    for (let i = 0; i < 30; i++) {
      ctx.fillStyle = `rgba(${Math.random()*100}, ${Math.random()*150}, ${Math.random()*100}, 0.5)`;
      ctx.beginPath();
      ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 1, 0, 2 * Math.PI);
      ctx.fill();
    }

    // 绘制文字
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 每个字符不同颜色和旋转角度
    for (let i = 0; i < captcha.length; i++) {
      ctx.fillStyle = `rgb(${Math.random()*80}, ${100 + Math.random()*50}, ${Math.random()*80})`;
      ctx.save();
      ctx.translate(30 + i * 25, 24);
      ctx.rotate((Math.random() - 0.5) * 0.4);
      ctx.fillText(captcha[i], 0, 0);
      ctx.restore();
    }

    // 将canvas转为图片并设置到容器
    document.getElementById('captchaImage').innerHTML = '';
    document.getElementById('captchaImage').appendChild(canvas);

    // 存储验证码（实际应用中应该在服务器端生成和验证）
    sessionStorage.setItem('captchaCode', captcha.toLowerCase());
  }

  // 页面加载时生成验证码
  window.addEventListener('load', function() {
    generateCaptcha();

    // 点击验证码刷新
    document.getElementById('captchaImage').addEventListener('click', generateCaptcha);

    // 密码可见性切换
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');

    togglePassword.addEventListener('click', function() {
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);

      // 切换图标
      this.classList.toggle('fa-eye');
      this.classList.toggle('fa-eye-slash');
    });

    // 检查是否有记住的账号
    const savedUsername = localStorage.getItem('savedUsername');
    if (savedUsername) {
      document.getElementById('username').value = savedUsername;
      document.getElementById('rememberMe').checked = true;
    }
  });

  // 登录表单提交处理
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const captcha = document.getElementById('captcha').value.trim().toLowerCase();
    const rememberMe = document.getElementById('rememberMe').checked;
    const storedCaptcha = sessionStorage.getItem('captchaCode');

    // 清除之前的错误提示
    document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));

    let isValid = true;

    // 验证账号
    if (!username) {
      document.getElementById('usernameError').textContent = '请输入账号';
      document.getElementById('usernameError').classList.add('show');
      isValid = false;
    }

    // 验证密码
    if (!password) {
      document.getElementById('passwordError').textContent = '请输入密码';
      document.getElementById('passwordError').classList.add('show');
      isValid = false;
    }

    // 验证验证码
    if (!captcha) {
      document.getElementById('captchaError').textContent = '请输入验证码';
      document.getElementById('captchaError').classList.add('show');
      isValid = false;
    } else if (captcha !== storedCaptcha) {
      document.getElementById('captchaError').textContent = '验证码不正确';
      document.getElementById('captchaError').classList.add('show');
      isValid = false;
      // 刷新验证码
      generateCaptcha();
    }

    // 如果验证通过
    if (isValid) {
      // 显示登录中状态
      const loginBtn = document.querySelector('.login-btn');
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登录中...';

      // 模拟登录请求延迟
      setTimeout(() => {
        // 实际应用中这里应该是真实的登录验证
        // 这里简化处理，直接登录成功

        // 记住账号
        if (rememberMe) {
          localStorage.setItem('savedUsername', username);
        } else {
          localStorage.removeItem('savedUsername');
        }

        // 存储登录状态
        localStorage.setItem('isAdminLoggedIn', 'true');
        localStorage.setItem('adminUsername', username);

        // 跳转到首页
        window.location.href = 'index.html';
      }, 1500);
    }
  });
</script>
</body>
</html>
